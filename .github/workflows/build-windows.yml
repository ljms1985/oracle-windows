# Oracle for Windows — GitHub Actions build
#
# Builds a standalone Oracle install on a real Windows machine in the
# cloud (GitHub-hosted windows-latest runner). No Windows packaging
# tools are needed locally to produce it.
#
# v1.0.2 is a ONE-DIR build: dist/Oracle/Oracle.exe plus its supporting
# files in the same folder (DLLs, _tcl_data/, _tk_data/, avatar). The
# whole dist/Oracle folder is the install — copy the folder, run
# Oracle.exe inside it. Do NOT move Oracle.exe out of its folder.
# One-file builds (v1.0.0/v1.0.1) crashed on Lorenza's real PC with
# "can't find a usable init.tcl" even though the extracted init.tcl
# was present — the _MEI temp extraction was the problem.
#
# UNSIGNED BUILD — no signing certificate, no code-signing secrets.
# On first launch on a real Windows PC, Windows SmartScreen / Defender
# will likely warn that the app is from an unknown publisher: the user
# clicks "More info" then "Run anyway". That is expected for an
# unsigned .exe, not a broken app. A code-signing certificate would be
# needed later to remove that warning — a separate step, not this build.
#
# Triggers:
#   - Manually: Actions tab -> "Build Oracle for Windows" -> Run workflow
#   - Automatically: pushing a tag like v1.0.2 (git tag v1.0.2 && git push --tags)
#
# Outputs (download from the finished run, under "Artifacts"):
#   - Oracle-windows-v1.0.2.zip — the whole dist/Oracle folder
#
# What the workflow does NOT do: it does not publish a release, does
# not test the GUI by clicking it, and does not bundle an OpenAI API
# key — the user adds her own key on first run. A human still needs to
# open Oracle.exe on a real Windows PC and check the avatar, voice,
# and camera work there.

name: Build Oracle for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Oracle.exe (Windows, unsigned)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Compile-check all Python files
        # PowerShell does not glob *.py for python, so list the files.
        run: python -m py_compile agent.py camera.py computer.py design3d.py email_alerts.py gui.py identity.py monitor.py oracle_paths.py repair.py rth_tcl.py security.py sms.py voice.py

      - name: Build Oracle (one-dir) with PyInstaller
        run: pyinstaller oracle-windows.spec

      # v1.0.2 gate: verify the Tcl/Tk layout a one-dir build must have.
      # PyInstaller 6 lays Tcl out FLAT in _tcl_data/ (init.tcl,
      # encoding/, msgs/ directly inside it) — that is its standard
      # layout, NOT _tcl_data/tcl8.6/. Same for _tk_data/tk.tcl.
      - name: Verify Tcl/Tk layout in dist/Oracle
        shell: pwsh
        run: |
          if (-not (Test-Path dist\Oracle\_tcl_data\init.tcl)) { Write-Error "ERROR: dist/Oracle/_tcl_data/init.tcl is missing"; exit 1 }
          if (-not (Test-Path dist\Oracle\_tk_data\tk.tcl)) { Write-Error "ERROR: dist/Oracle/_tk_data/tk.tcl is missing"; exit 1 }
          if (-not (Test-Path dist\Oracle\_tcl_data\encoding)) { Write-Error "ERROR: dist/Oracle/_tcl_data/encoding is missing"; exit 1 }
          Write-Host "Tcl/Tk layout OK: _tcl_data/init.tcl, _tk_data/tk.tcl and _tcl_data/encoding present."

      # Gate: do NOT ship a build whose tkinter cannot start. Build the
      # console debug exe from the same code/spec and run its smoke test
      # — it proves tk.Tk() finds init.tcl. The windowed build hides
      # tracebacks, so this gate is what catches a repeat of the
      # "Failed to execute script 'gui'" crash before release.
      - name: Smoke-test tkinter startup (console debug build)
        shell: pwsh
        run: |
          pyinstaller oracle-windows-debug.spec
          $env:ORACLE_SMOKE_TEST = "1"
          $out = & dist\Oracle-debug\Oracle-debug.exe 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "SMOKE OK") { Write-Error "SMOKE TEST FAILED: tkinter did not start in the frozen build"; exit 1 }
          Write-Host "Smoke test passed: tkinter started in the frozen build."

      - name: Verify Oracle.exe is a real Windows PE executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist\Oracle\Oracle.exe)) { Write-Error "ERROR: dist/Oracle/Oracle.exe was not built"; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes("dist/Oracle/Oracle.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { Write-Error "ERROR: Oracle.exe does not start with the MZ header"; exit 1 }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $peSig = [System.Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4)
          if ($peSig -ne "PE`0`0") { Write-Error "ERROR: Oracle.exe has no PE signature"; exit 1 }
          $sizeMB = [math]::Round((Get-Item dist\Oracle\Oracle.exe).Length / 1MB, 1)
          Write-Host "Oracle.exe verified: PE executable, $sizeMB MB"
          # Avatar must be bundled in the one-dir folder (check the spec datas)
          Select-String -Path oracle-windows.spec -Pattern "assets/avatar.png" -Quiet | Out-Null
          Get-Item dist\Oracle\Oracle.exe | Format-List Name, Length, LastWriteTime

      - name: Zip the one-dir install folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Oracle -DestinationPath Oracle-windows-v1.0.2.zip
          Get-Item Oracle-windows-v1.0.2.zip | Format-List Name, Length, LastWriteTime

      - name: Upload Oracle install zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-windows-v1.0.2-zip
          path: Oracle-windows-v1.0.2.zip
          if-no-files-found: error
